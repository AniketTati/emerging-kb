# Master entity registry — shared across ALL demo-corpus domains.
#
# Every document references entities from here by `id`. The downstream
# identity resolver should converge on the same canonical entity given
# the same `id` even when surface forms differ ("Acme Corp" vs "ACME
# Corp Pvt Ltd" vs "Acme") — this is how we test L4 identity resolution
# at corpus scale.
#
# Cross-domain hooks:
#   - `acme_corp` appears in Legal (counterparty in MSA) AND in Finance
#     (counterparty in bank statements) — deliberate stressor for the
#     "mixed" workspace.
#   - `mehta_law_partners` appears in Legal and Government (counsel of
#     record on a tender dispute).
#   - `apollo_hospitals_pune` appears in Healthcare (patient encounters)
#     and Finance (loan agreement debtor).
#
# Surface-form variants are intentional: identity resolution must
# collapse "Acme Corp Pvt Ltd", "Acme Corp", "ACME", "Acme Corporation"
# to the same canonical row.

