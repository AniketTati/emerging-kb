# ---------------------------------------------------------------------------
# Conflict pairs — fact_conflicts seeded across the corpus.
# These specify which docs deliberately disagree, and what predicate
# the system should resolve.
# ---------------------------------------------------------------------------
conflicts:
  - predicate: payment_terms
    chain: chain_acme_vertex_msa
    candidates:
      - { doc: legal/docs/msa-001-acme-vertex.md,    value: "NET-30", authority: 0.6 }
      - { doc: legal/docs/msa-001-amendment-1.md,    value: "NET-45", authority: 0.8 }
      - { doc: legal/docs/msa-001-amendment-2.md,    value: "NET-60", authority: 0.95 }
    expected_winner: { doc: legal/docs/msa-001-amendment-2.md, value: "NET-60" }
    expected_rule: chain   # Design 2 — chain-aware supersession

  - predicate: nda_term_years
    chain: chain_nda_acme_vertex_pair
    candidates:
      - { doc: legal/docs/nda-mutual-001-acme-vertex.md,    value: "2 years", authority: 0.7 }
      - { doc: legal/docs/nda-unilateral-001-acme-vertex.md, value: "5 years", authority: 0.7 }
    expected_winner: null
    expected_rule: unresolved   # Both signed; different scopes → surface both

  - predicate: indemnity_cap_usd
    chain: chain_acme_vertex_msa
    candidates:
      - { doc: legal/docs/msa-001-acme-vertex.md,    value: "1,000,000", authority: 0.6 }
      - { doc: legal/docs/msa-001-side-letter.md,    value: "5,000,000", authority: 0.9 }
    expected_winner: { doc: legal/docs/msa-001-side-letter.md, value: "5,000,000" }
    expected_rule: authority   # Side letter signed by both CEOs

  # ---------------------------------------------------------------------
  # Healthcare conflicts
  # ---------------------------------------------------------------------
  - predicate: tsh_mIU_per_L
    chain: chain_kavya_reddy_thyroid_pair
    candidates:
      - { doc: healthcare/docs/lab-003-kavya-reddy-thyroid-v1.md, value: "9.4", authority: 0.7 }
      - { doc: healthcare/docs/lab-004-kavya-reddy-thyroid-v2.md, value: "3.1", authority: 0.9 }
    expected_winner: { doc: healthcare/docs/lab-004-kavya-reddy-thyroid-v2.md, value: "3.1" }
