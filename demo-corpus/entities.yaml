# ---------------------------------------------------------------------------
# Rare-clause / anomaly stressors — for atomic_units_rarity channel.
# Each entry points at the doc that *intentionally* contains an outlier.
# ---------------------------------------------------------------------------
anomalies:
  - id: rare_4hr_delivery
    doc: legal/docs/msa-002-acme-nimbus.md
    description: |
      4-hour delivery SLA for production incidents (the corpus norm is
      24-48h). This is the "rare-clause needle" from arch §10.2.
    expected_rarity_score: ">0.85"

  - id: rare_mfn_clause
    doc: legal/docs/license-001-acme-orion-mfn.md
    description: Most-favored-nation pricing clause (very uncommon outside enterprise SaaS).
    expected_rarity_score: ">0.80"

  - id: rare_non_compete_36mo
    doc: legal/docs/employment-001-vikram-kale.md
    description: |
      36-month post-termination non-compete (typical is 6-12 months).
      Atomic-unit rarity should flag this.
    expected_rarity_score: ">0.85"

  - id: rare_unlimited_liability
    doc: legal/docs/employment-002-sneha-joshi.md
    description: |
      Unlimited personal liability for IP indemnification — very unusual
      in employment offers.
    expected_rarity_score: ">0.90"

  # ---------------------------------------------------------------------
  # Healthcare anomalies — extreme abnormal lab values
  # ---------------------------------------------------------------------
  - id: rare_extreme_creatinine
    doc: healthcare/docs/lab-005-suresh-iyer-renal.md
    description: |
      Serum creatinine 7.8 mg/dL (normal range 0.6-1.3). Indicates
      acute kidney injury — extreme rarity.
    expected_rarity_score: ">0.95"

  - id: rare_high_potassium_with_ekg
    doc: healthcare/docs/lab-007-shyam-rajput-hyperkalemia.md
    description: |
      Potassium 7.2 mEq/L with peaked T-waves on EKG — life-threatening
      hyperkalemia.
    expected_rarity_score: ">0.95"

  - id: rare_handwritten_rx_polypharmacy
    doc: healthcare/docs/rx-005-priya-iyer-polypharmacy.md
    description: |
      6-drug regimen on a single Rx (typical is 1-3 drugs).
    expected_rarity_score: ">0.80"

  # ---------------------------------------------------------------------
  # Mining anomalies (extreme operational events)
  # ---------------------------------------------------------------------
  - id: rare_fatal_collapse_incident
    doc: mining/docs/incident-005-jharia-fatal-roof-collapse.md
    description: |
      Fatal roof-collapse incident — single most severe event in this
      corpus. Multi-fatality (3) safety incident; very rare. Atomic-
      unit rarity should flag this.
    expected_rarity_score: ">0.95"

  - id: rare_methane_explosion
    doc: mining/docs/incident-007-bokaro-methane-explosion.md
    description: |
      Methane gas explosion at Bokaro coal block — second-order rarity
      event (no fatalities, but significant property damage and
      injuries). Combined with the gas-monitoring failure that preceded
      it, this is a chained-cause anomaly.
    expected_rarity_score: ">0.90"

  - id: rare_zinc_grade_outlier
    doc: mining/docs/lab-assay-003-rajpura-zinc-anomaly.md
    description: |
      Assay sample shows zinc grade of 28.4% (vs the deposit average
      of ~5%). Either contamination or a previously-unsampled high-
      grade vein. Atomic-unit rarity stressor.
    expected_rarity_score: ">0.90"

  # ---------------------------------------------------------------------
  # Government anomalies (cross-record outliers + adversarial patterns)
  # ---------------------------------------------------------------------
  - id: rare_ration_aadhaar_missing
    doc: government/docs/welfare-001-ration-card-anomaly-list.md
    description: |
      List of ration-card beneficiaries WITHOUT linked Aadhaar — a
      red-team scenario for set-op queries ("households with ration
      card AND no Aadhaar"). Rare in the post-Aadhaar-linkage period.
    expected_rarity_score: ">0.80"

  - id: rare_fir_high_value_dispute
    doc: government/docs/fir-003-beed-land-dispute-scanned.md
    description: |
      FIR for a high-value land dispute (claimed value INR 24 crore).
      Outlier vs typical FIR values.
    expected_rarity_score: ">0.85"

  # ---------------------------------------------------------------------
  # Finance anomalies
  # ---------------------------------------------------------------------
  - id: rare_aml_structured_transactions
    doc: finance/docs/statement-006-suspicious-aml-pattern.md
    description: |
      Bank-statement shows 7 transactions of INR 9.5 lakh each on the
      same day to different beneficiaries — classic structured-deposit
      AML stressor (each just under the INR 10 lakh CTR reporting
      threshold).
    expected_rarity_score: ">0.95"

  - id: rare_billion_dollar_wire
    doc: finance/threads/wire-004-suspicious-large-transfer.eml
    description: |
      Email thread documenting an attempted wire transfer of USD 1.2
      billion — flagged by AML, ultimately cancelled. Extreme outlier
      for the corpus.
    expected_rarity_score: ">0.95"


