# ---------------------------------------------------------------------------
# Doc chains — explicit lineage between docs.
# Each chain id is referenced from individual docs' front-matter.
# ---------------------------------------------------------------------------
chains:
  - id: chain_acme_vertex_msa
    type: contract_chain
    description: |
      Master Services Agreement between Acme Corp and Vertex Industries,
      followed by 2 amendments and 1 side letter. Payment terms shift
      across the chain (NET-30 → NET-45 → NET-60), creating a Design 2
      conflict the orchestrator must resolve via chain rules.
    members:
      - { doc: legal/docs/msa-001-acme-vertex.md,           role: original,  version_index: 0 }
      - { doc: legal/docs/msa-001-amendment-1.md,           role: amendment, version_index: 1 }
      - { doc: legal/docs/msa-001-amendment-2.md,           role: amendment, version_index: 2 }
      - { doc: legal/docs/msa-001-side-letter.md,           role: amendment, version_index: 3 }

  - id: chain_acme_nimbus_sow
    type: sow_chain
    description: |
      MSA between Acme and Nimbus Technologies (Singapore-governed),
      then 2 SOWs scoped under it.
    members:
      - { doc: legal/docs/msa-002-acme-nimbus.md,           role: original,  version_index: 0 }
      - { doc: legal/docs/sow-001-acme-nimbus.md,           role: amendment, version_index: 1 }
      - { doc: legal/docs/sow-002-acme-nimbus.md,           role: amendment, version_index: 2 }

  - id: chain_acme_orion_msa
    type: contract_chain
    description: |
      Acme-Orion MSA with one amendment that introduces a most-favored-
      nation clause (rare-clause stressor).
    members:
      - { doc: legal/docs/msa-003-acme-orion.md,            role: original,  version_index: 0 }
      - { doc: legal/docs/license-001-acme-orion-mfn.md,    role: amendment, version_index: 1 }

  - id: chain_nda_acme_vertex_pair
    type: nda_pair
    description: |
      Mutual NDA between Acme and Vertex (early-stage discussion),
      then a unilateral NDA from Acme→Vertex (later, with different
      term length). Same parties, two different scopes — Design 2
      conflict test.
    members:
      - { doc: legal/docs/nda-mutual-001-acme-vertex.md,    role: original,  version_index: 0 }
      - { doc: legal/docs/nda-unilateral-001-acme-vertex.md, role: original, version_index: 0 }

  - id: thread_vertex_renewal
    type: email_thread
    description: |
      Email thread between Acme and Vertex on contract renewal —
      seeds context for follow-up dialogue queries.
    members:
      - { doc: legal/threads/vertex-renewal-thread.eml,     role: original,  version_index: 0 }

