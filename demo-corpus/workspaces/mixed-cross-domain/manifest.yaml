# Total: 5 NEW bridge docs + 35 REFERENCED docs from other domains = 40 docs
# in the workspace.
#
# Notes:
#   - `ref: domain/doc-id` references existing docs. The mixed-cross-domain
#     workspace does not duplicate doc bodies — only the bridge docs are NEW.
#   - At evaluation time, the runtime resolves each `ref:` to the actual
#     file path via the source domain's manifest. This way the workspace
#     stays a consistent view + can be re-balanced without copying bytes.
#   - The actual file paths for referenced docs are:
#     - legal/* → demo-corpus/domains/legal/docs/ (or threads/ for .eml)
#     - finance/* → demo-corpus/domains/finance/docs/ (or threads/)
#     - construction/* → demo-corpus/domains/construction/docs/ (or threads/)
#     - healthcare/* → demo-corpus/domains/healthcare/docs/
#     - mining/* → demo-corpus/domains/mining/docs/
#     - government/* → demo-corpus/domains/government/docs/

