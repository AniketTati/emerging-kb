# Legal domain manifest — per-doc inventory with intentional stressors,
# entity references, and gold-for-query mappings.
#
# Schema:
#   - id              : stable doc id used in queries.yaml
#   - file            : path relative to demo-corpus/
#   - doc_type        : inferred_doc_type the L2b extractor should land on
#   - title           : human-readable
#   - parties         : list of entity_registry ids (from ../entities.yaml)
#   - chain           : chain_id from entities.yaml (null if standalone)
#   - chain_role      : original | amendment (matches doc_chain_members.role)
#   - chain_version   : integer index within the chain
#   - authority       : source_authority hint (0.0-1.0). Drafts < signed.
#   - doc_status      : live | draft | superseded | archived | retracted
#   - jurisdiction    : governing law (Singapore-law contract is a F-mode test)
#   - stressors       : list of intentional features the eval should exercise
#   - gold_for        : list of query ids in queries.yaml that cite this doc
#   - rare_clauses    : optional — rare-clause signatures the rarity scorer
#                       should pick up

domain: legal
description: |
  55 legal docs across 10 subtypes. Most-Favored-Nation clauses,
  amendment chains, conflict pairs, PII-bearing employment offers,
  scanned-PDF lease, and cross-domain vendor agreement are all
  deliberately seeded as stressors.

