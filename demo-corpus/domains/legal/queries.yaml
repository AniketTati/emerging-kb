  expected_answer: The Acme-Vertex MSA (msa-001-acme-vertex) includes an IP indemnification clause (Section
    5.3) where Vertex, as the vendor, agrees to defend and indemnify Acme against third-party claims alleging
    that Acme's authorized use of the Services infringes intellectual property rights. The liability for
    such claims is capped at the greater of $1,000,000 or the fees paid/payable in the preceding twelve
    months, as per Section 5.1. However, a subsequent Side Letter (msa-001-side-letter) dated September
    10, 2025, specifically increases Vertex's total aggregate liability for IP indemnification claims
    to $5,000,000 per contract year, overriding the cap in Section 5.1 solely for IP indemnification.
  expected_citations:
  - msa-001-acme-vertex
  - msa-001-side-letter
