# Construction domain manifest — 46 docs across 12 subtypes.
#
# Headline stressors:
#   - Acme Whitefield Datacentre drawing chain (Rev A → B → C with the
#     load-bearing wall conflict between architectural Rev A vs structural
#     calculation; resolved in Rev B + Rev C).
#   - Safety incident chain (initial 24h report vs detailed investigation
#     vs corrective action — root cause classification flips from "worker
#     error" to "PPE non-availability + supervision gap").
#   - Multilingual scanned labour contract (Marathi + Hindi + English).
#   - Aadhaar PII in daily site report + labour contract.
#   - Cross-domain hooks: Acme Corp (Finance datacentre collateral cited
#     in loan-001-addendum-2); Apollo Hospitals Pune (Healthcare —
#     maternity ward Phase-2 drawings); Mahalaxmi Infra (Mining — vendor
#     on incident-003-mining); CIDCO (Government); MMRDA (Government).
#   - Authority stressor: draft pre-approval treasury memos vs final
#     signed versions (treasury-003 DRAFT in Finance).

domain: construction
description: |
  46 construction docs across architectural drawings, structural
  calculations, MEP drawings, BoQs, EPC + subcontract agreements,
  safety reports + incident chains, daily site reports, RFIs,
  inspections, change orders, quality + NCR reports, purchase orders,
  meeting minutes, commissioning, handover, and stakeholder records.
  Drawing chain + safety incident chain are the two headline stressor
  patterns; cross-domain hooks to Finance + Healthcare + Government +
  Mining seeded throughout.

