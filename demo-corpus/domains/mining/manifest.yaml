# Mining domain manifest — 50 docs across 9 subtypes.
#
# Headline stressors:
#   - Noamundi drilling-report 3-revision chain (Design 2 + Design 3):
#     ore-grade % shifts as core samples accumulate.
#   - Parsa env clearance + corrigendum chain (cap raised 12 → 18 MTPA).
#   - Multi-hop: incident-003 (Noamundi vendor equipment) + DGMS
#     inspection report = vendor-fault traceability across two docs.
#   - Fatal roof collapse (incident-005) + methane explosion (incident-007)
#     = atomic-unit rarity stressors.
#   - Marathi+English mixed lease scan = multilingual OCR stressor.
#   - Mine plan diagrams = ColPali (Wave C) fallback markers.
#   - Vintage 1987 union agreement scan = old-handwriting OCR stressor.

domain: mining
description: |
  50 mining docs across 9 subtypes: drilling reports, mine-lease deeds,
  safety incidents, env clearances, pollution reports, lab assays,
  mine plans, union agreements, and shift logs. Multi-revision chains +
  govt corrigendum + multi-hop vendor-equipment incident + extreme
  safety events + multilingual scan are all deliberately seeded.

