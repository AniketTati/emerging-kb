- id: finance-q024
  question: The PMLA rule says INR 10 lakh CTR threshold; HDFC's internal compliance bulletin says INR
    5 lakh. Which is operative?
  stratum: conflict-resolution
  layers:
  - L7
  planner_modes:
  - D
  channels:
  - bm25_chunks
  design_gaps:
  - D2_conflicts
  difficulty: hard
  expected_answer: The operative threshold for Cash Transaction Reports (CTR) is INR 10,00,000, as stipulated
    by the PMLA Rules 2005 Rule 3(B) and the RBI Master Direction on KYC. While HDFC's internal compliance
    bulletin (FED-COMP-2024-08) tightened its internal risk threshold to INR 5,00,000 per cash deposit,
    this is an internal guideline and the regulatory threshold remains INR 10,00,000.
  expected_citations:
  - statement-006-suspicious-aml-pattern
  evidence_quote: 'PMLA Rules 2005 Rule 3(B) | INR 10,00,000 single transaction OR aggregate of INR 10,00,000
    in connected transactions in a month

    RBI Master Direction on KYC (2016, as amended 2024) | INR 10,00,000 OR aggregate of connected transactions
    within a month

    Note (Conflict): In FY 2024 internal compliance bulletin (FED-COMP-2024-08), the bank''s risk threshold
    for internal review was tightened to INR 5,00,0'
  answer_provenance: corpus_grounded
  verified: true
