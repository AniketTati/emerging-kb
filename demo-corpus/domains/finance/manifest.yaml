# Finance domain manifest — 46 docs across 9 subtypes.
#
# Headline stressors:
#   - Acme/HDFC loan chain (original + 2 addenda; interest rate flips
#     8.85 → 9.40%); Design 2 + 3 conflict.
#   - Aniket Desai complaint chain (initial → resolution).
#   - AML structured-transaction pattern (7 × INR 9.5L same day at Federal Bank).
#   - USD 1.2 billion attempted wire (must-refuse stressor + fabricated
#     "FEMA Circular #99999" false-premise).
#   - 3 SEC-style 10-Ks (NorthWind US, Solaris IND, Marigold Pharma — long-
#     context for RAPTOR apex retrieval stress).
#   - KYC + complaint with PII (Aadhaar + PAN + bank account + mobile + email).
#   - Treasury draft FY26 budget (authority stressor: DRAFT vs LIVE).
#   - Cross-domain: HDFC Bank, Acme Corp, Apollo Hospitals, Priya Iyer name
#     collision (legal VP vs healthcare patient).

domain: finance
description: |
  46 finance docs across bank statements, loans + addenda chains, demo
  SEC-style 10-Ks, KYC records with PII, customer complaint tickets,
  treasury memos (incl. a DRAFT), audit reports, wire-transfer email
  threads, and customer profiles. Numeric aggregation (Q-mode), structured-
  AML pattern, long-context RAPTOR stress, PII redaction, false-premise
  defenses, and draft-vs-live authority gating are all seeded.

